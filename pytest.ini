[pytest]
testpaths = tests
# importlib: test files in different area folders may share a basename
# (tests/area_a/test_bonsai_dataprocessing.py and tests/area_b/test_bonsai_dataprocessing.py).
addopts = -ra --strict-markers --import-mode=importlib
# Per-test limit (pytest-timeout); a session fixture's Bonsai runs count toward the first test that uses it.
timeout = 300
markers =
    mpi: runs Bonsai under mpiexec; skipped when mpiexec or mpi4py is missing
    scout: needs the Bonsai-scout environment (h5py, tables, shiny); skipped elsewhere
